services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup antes}
      POSTGRES_DB: erp
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - erp_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  erp_data:
